<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Contact — Claude Vidot | Portfolio</title>
<meta name="description" content="Contactez Claude Vidot via LinkedIn, GitHub ou le formulaire : indiquez votre nom, votre adresse mail et votre message.">
<meta name="author" content="Claude Vidot">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top-navigation">
  <a href="index.html" class="home-link">← Retour à l'accueil</a>
  <nav class="navigation-links" aria-label="Navigation principale">
    <a href="about.html">À propos</a>
    <a href="competences.html">Compétences et Expérience</a>
    <a href="cv.html">Mon CV</a>
    <a href="contact.html" class="active" aria-current="page">Contact</a>
  </nav>
</header>

<main>
  <section class="content-section">
    <h1>Contact</h1>
    <p>Une question, une opportunité, envie d'échanger ? Retrouvez-moi en ligne ou remplissez le formulaire ci-dessous.</p>

    <h2>Me retrouver en ligne</h2>
    <div class="contact-links">
      <a href="https://www.linkedin.com/in/claude-v-684a30134/" target="_blank" rel="noopener" aria-label="LinkedIn (s'ouvre dans un nouvel onglet)">LinkedIn</a>
      <a href="https://github.com/Kurodo97420" target="_blank" rel="noopener" aria-label="GitHub (s'ouvre dans un nouvel onglet)">GitHub</a>
    </div>

    <h2>M'écrire un message</h2>
    <form class="contact-form">
      <label for="name">Nom et Prénom</label>
      <input type="text" id="name" name="name" placeholder="Votre nom et prénom" autocomplete="name" required>

      <label for="email">Adresse mail</label>
      <input type="email" id="email" name="email" placeholder="vous@email.com" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Écrivez votre message..." required></textarea>

      <button type="submit" class="button-link">Envoyer</button>
    </form>
  </section>
</main>

</body>
</html>
