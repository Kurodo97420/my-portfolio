<section class="content-section">
  <h1>Contact</h1>
  <p>Une question, une opportunité, envie d'échanger ? Remplissez le formulaire ci-dessous.</p>
  <form class="contact-form">
    <label for="name">Nom et Prénom</label>
    <input type="text" id="name" name="name" placeholder="Votre nom et prénom" required>

    <label for="email">Adresse mail</label>
    <input type="email" id="email" name="email" placeholder="vous@email.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" placeholder="Écrivez votre message..." required></textarea>

    <button type="submit" class="button-link">Envoyer</button>
  </form>
</section>

</body>
